<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Shadow -->
    <filter id="appShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Monitor Inner Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Base Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Monitor Gradients -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <radialGradient id="meshGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle with macOS Shadow -->
  <g filter="url(#appShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgGrad)" />
    <!-- Ambient Top-Center Glow inside the icon -->
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#meshGlow)" />
    <!-- Subtle Inner Border -->
    <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />
  </g>

  <!-- Central Element: Hardware Monitor & KVM Display -->
  <!-- Monitor Stand Base & Stem -->
  <g opacity="0.95">
    <ellipse cx="512" cy="720" rx="140" ry="24" fill="#090d16" />
    <path d="M472 630 L552 630 L562 715 L462 715 Z" fill="url(#bezelGrad)" stroke="#475569" stroke-width="2" />
    <path d="M412 712 C412 702 460 698 512 698 C564 698 612 702 612 712 L612 724 C612 734 564 738 512 738 C460 738 412 734 412 724 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Monitor Bezel Outer Frame -->
  <rect x="216" y="240" width="592" height="400" rx="36" fill="url(#bezelGrad)" stroke="#475569" stroke-width="3" />
  <!-- Display Screen Glass -->
  <rect x="236" y="260" width="552" height="340" rx="20" fill="#030712" />
  <rect x="236" y="260" width="552" height="340" rx="20" fill="url(#screenGrad)" opacity="0.92" />

  <!-- Screen Grid / Scanlines Matrix Subtle Texture -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="236" y1="328" x2="788" y2="328" />
    <line x1="236" y1="396" x2="788" y2="396" />
    <line x1="236" y1="464" x2="788" y2="464" />
    <line x1="236" y1="532" x2="788" y2="532" />
    <line x1="346" y1="260" x2="346" y2="600" />
    <line x1="456" y1="260" x2="456" y2="600" />
    <line x1="568" y1="260" x2="568" y2="600" />
    <line x1="678" y1="260" x2="678" y2="600" />
  </g>

  <!-- Target PC Crosshair & Cursor HUD (KVM Remote Operation) -->
  <g transform="translate(512, 430)">
    <!-- Central Target Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-dasharray="14 10" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75" />
    <circle cx="0" cy="0" r="14" fill="#38bdf8" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />

    <!-- Crosshair reticle ticks -->
    <line x1="-115" y1="0" x2="-75" y2="0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="75" y1="0" x2="115" y2="0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="0" y1="-115" x2="0" y2="-75" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="0" y1="75" x2="0" y2="115" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- AI Sparkle / Agent Star (Upper Right HUD) -->
    <path d="M 68,-68 Q 68,-40 96,-40 Q 68,-40 68,-12 Q 68,-40 40,-40 Q 68,-40 68,-68 Z" fill="#fbbf24" filter="url(#cyanGlow)" />
    <!-- AI Small Star (Lower Left HUD) -->
    <path d="M -70,50 Q -70,66 -54,66 Q -70,66 -70,82 Q -70,66 -86,66 Q -70,66 -70,50 Z" fill="#67e8f9" />
  </g>

  <!-- Screen Glass Gloss Highlight (Diagonal) -->
  <path d="M 236 260 L 520 260 L 320 600 L 236 600 Z" fill="#ffffff" opacity="0.08" />

  <!-- NanoKVM Dongle Hardware Chip (Floating Badge Lower Right) -->
  <g transform="translate(640, 580)" filter="url(#appShadow)">
    <!-- Device Body -->
    <rect x="0" y="0" width="170" height="110" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <!-- Gold / Silver USB-C Connector Tab -->
    <rect x="-24" y="32" width="26" height="46" rx="6" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2" />
    <!-- Brand Label & Activity LEDs -->
    <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="1">NANO</text>
    <text x="110" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" letter-spacing="1">KVM</text>

    <!-- Activity LEDs -->
    <!-- Power LED (Green) -->
    <circle cx="48" cy="76" r="6" fill="#10b981" filter="url(#cyanGlow)" />
    <circle cx="48" cy="76" r="2.5" fill="#ffffff" />
    <text x="62" y="80" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8">PWR</text>

    <!-- MCP Link LED (Cyan) -->
    <circle cx="106" cy="76" r="6" fill="#06b6d4" filter="url(#cyanGlow)" />
    <circle cx="106" cy="76" r="2.5" fill="#ffffff" />
    <text x="120" y="80" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">MCP</text>
  </g>
</svg>
